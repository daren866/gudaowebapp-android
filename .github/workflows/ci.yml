name: Build and Release APK

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 手动安装 Android SDK（不依赖 android-actions/setup-android，那个动作内部会拉取
      # 已被移除的 legacy `tools` 包而失败）。安装 cmdline-tools + 接受许可 + 装 platform 36。
      - name: Install Android SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/Android/Sdk"
          mkdir -p "$ANDROID_HOME"
          cd "$HOME"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -O cmdline-tools.zip
          rm -rf "$HOME/cmdline-tools-tmp"
          unzip -q cmdline-tools.zip -d "$HOME/cmdline-tools-tmp"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv "$HOME/cmdline-tools-tmp/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          rm -rf "$HOME/cmdline-tools-tmp" "$HOME/cmdline-tools.zip"
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1 || true
          # 优先装指定 build-tools；若该版本不存在则退化为仅装 platform（AGP 会自动补齐 build-tools）
          "$SDKMGR" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.0.0" "platform-tools" || \
            "$SDKMGR" --sdk_root="$ANDROID_HOME" "platforms;android-36" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs -name "*.apk" -type f | head -1)
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Extract version
        id: version
        run: |
          VERSION_NAME=$(grep -E 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | head -1)
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION_NAME}"

      - name: Clean old APK assets from nightly release
        run: |
          TAG="android-nightly"
          REPO="${{ github.repository }}"
          REL=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/$REPO/releases/tags/$TAG")
          REL_ID=$(echo "$REL" | python3 -c "import json,sys; print(json.load(sys.stdin).get('id',''))" 2>/dev/null || echo "")
          if [ -z "$REL_ID" ]; then echo "release not found yet, skip cleanup"; exit 0; fi
          APK_IDS=$(echo "$REL" | python3 -c "import json,sys; d=json.load(sys.stdin); print(' '.join(str(a['id']) for a in d.get('assets',[]) if a['name'].endswith('.apk')))" 2>/dev/null || echo "")
          for AID in $APK_IDS; do
            echo "deleting old APK asset $AID"
            curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "https://api.github.com/repos/$REPO/releases/assets/$AID" > /dev/null || true
          done

      - name: Create / update Release (nightly)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: android-nightly
          name: Android Nightly (${{ steps.version.outputs.version_name }})
          body: |
            ## Android 资源离线包构建产物

            - 包名: `com.gudao.coderandroid`
            - 版本: ${{ steps.version.outputs.version_name }}
            - 提交: ${{ github.sha }}
            - 构建时间: ${{ github.event.head_commit.timestamp }}
          prerelease: true
          files: ${{ steps.apk.outputs.apk_path }}
          token: ${{ secrets.GITHUB_TOKEN }}
